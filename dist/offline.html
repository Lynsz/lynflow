<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030712" />
  <title>Lynflow offline</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #030712;
      color: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(20, 184, 166, 0.18), transparent 32rem),
        linear-gradient(135deg, #030712 0%, #111827 100%);
    }

    main {
      width: min(100%, 520px);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 24px;
      padding: 32px;
      background: rgba(15, 23, 42, 0.78);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      margin-top: 16px;
      border-radius: 16px;
      padding: 12px 16px;
      background: #14b8a6;
      color: #04111d;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main>
    <h1>Lynflow esta offline</h1>
    <p>
      Nao foi possivel carregar a pagina agora. Verifique sua conexao e tente novamente.
      Se voce ja abriu o app antes, os dados locais continuam salvos no navegador.
    </p>
    <a href="/">Tentar novamente</a>
  </main>
</body>

</html>
